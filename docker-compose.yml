# Local dev:   docker compose up -d                 (Postgres + MinIO + Keycloak; run the app with `npm run dev -- -p 3100`)
# Production:  docker compose --profile prod up -d --build   (adds the app + Caddy for HTTPS)
#
# All values come from `.env` (see .env.example). Local defaults work out of the box;
# production must set DOMAIN, APP_URL, KC_HOSTNAME, KC_COMMAND and real secrets.
# Fixed project name: containers/volumes/networks are namespaced (ajaia-docs_*), so this stack can
# share a host with other compose projects without touching them.
name: ajaia-docs

services:
  db:
    image: postgres:16-alpine
    mem_limit: 768m
    restart: unless-stopped
    environment:
      POSTGRES_USER: ajaia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ajaia}
      POSTGRES_DB: ajaia
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate `keycloak` database on a fresh volume.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ajaia -d ajaia"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Official minio/minio images are no longer published; pgsty/minio is a maintained
  # drop-in community build. Pinned to an exact release.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    mem_limit: 512m
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-ajaia}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-ajaia-secret-key}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:${MINIO_PORT:-9100}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9101}:9001"

  # Identity provider (OIDC). The `ajaia` realm — client + demo users — is imported from
  # ./keycloak/realm-ajaia.json on first start (existing realms are left untouched).
  # Local: dev mode on http://localhost:8180. Prod: KC_COMMAND="start --import-realm" and
  # KC_HOSTNAME=http://keycloak:8080 — internal-only (not routed by Caddy); the app's server
  # exchanges credentials with it, browsers never talk to it. Admin console: SSH tunnel to :8180.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    mem_limit: 1g
    restart: unless-stopped
    command: ${KC_COMMAND:-start-dev --import-realm}
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: ajaia
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-ajaia}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:8180}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx512m"
      # Substituted into the realm import file (${APP_URL}, ${KC_CLIENT_SECRET}).
      APP_URL: ${APP_URL:-http://localhost:3100}
      KC_CLIENT_SECRET: ${KC_CLIENT_SECRET:-dev-client-secret}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:${KC_PORT:-8180}:8080"
    depends_on:
      db:
        condition: service_healthy

  app:
    profiles: ["prod"]
    build: .
    mem_limit: 1g
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ajaia:${POSTGRES_PASSWORD:-ajaia}@db:5432/ajaia
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-ajaia-attachments}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ajaia}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-ajaia-secret-key}
      AUTH_URL: ${APP_URL:-http://localhost:3100}
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_KEYCLOAK_ID: ajaia-docs
      AUTH_KEYCLOAK_SECRET: ${KC_CLIENT_SECRET:-dev-client-secret}
      AUTH_KEYCLOAK_ISSUER: ${KC_HOSTNAME:-http://localhost:8180}/realms/ajaia
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      keycloak:
        condition: service_started

  caddy:
    profiles: ["prod"]
    image: caddy:2-alpine
    mem_limit: 256m
    restart: unless-stopped
    ports:
      # Defaults for a dedicated VPS. On a shared host, e.g. HTTP_BIND=8090 and HTTPS_BIND=127.0.0.1:8453.
      - "${HTTP_BIND:-80}:80"
      - "${HTTPS_BIND:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # HTTPS without owning ports 80/443 (e.g. on a shared host): a Cloudflare quick tunnel to Caddy.
  # Opt-in: docker compose --profile prod --profile tunnel up -d   → URL appears in `docker compose logs tunnel`.
  # Set APP_URL in .env to that https URL. (Quick-tunnel URLs change if this container is recreated.)
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2026.10.0
    mem_limit: 128m
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://caddy:80
    depends_on:
      - caddy

volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:
